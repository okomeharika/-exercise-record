<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7efe3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>運動記録</title>
<style>
:root{
  --bg:#f7efe3; --card:#fffaf3; --card2:#fcf4ea; --text:#553b2d;
  --muted:#8a6f60; --border:#ead8c8; --pink:#e8b7bd; --pink2:#f2d4d6;
  --pink-dark:#9c626a; --shadow:0 6px 20px rgba(93,65,47,.07);
  --mon:#e8c85b; --tue:#e79a9a; --wed:#8fb9d9; --thu:#a9c99a;
  --fri:#c7a7d8; --sat:#e5ad7c; --sun:#b6a6a0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Meiryo,"メイリオ",system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
button,input{font:inherit}
.app{max-width:720px;margin:0 auto;padding:20px 16px 44px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 18px}
h1{font-size:25px;margin:0;font-weight:700;letter-spacing:.04em}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
p{margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.nav button,.seg button,.ghost,.primary{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:10px 8px;cursor:pointer}
.nav button.active,.seg button.active{background:var(--pink2);border-color:#e6b8bd;color:var(--pink-dark);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{display:block;font-size:12px;color:var(--muted)}
input{width:100%;margin-top:6px;border:1px solid var(--border);border-radius:11px;background:#fffdf9;color:var(--text);padding:11px 10px;outline:none}
input:focus{border-color:#d9a6ad;box-shadow:0 0 0 3px rgba(232,183,189,.22)}
.primary{background:var(--pink);border-color:#dca8ae;color:#57353a;font-weight:700;width:100%;margin-top:12px}
.ghost{background:transparent}
.status{font-size:12px;color:var(--pink-dark);min-height:18px;margin-top:7px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weektitle{text-align:center;font-weight:700;font-size:14px;flex:1}
.metrics{display:grid;gap:13px}
.metric-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.metric-head strong{font-size:13px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dayname{text-align:center;font-size:10px;color:var(--muted);margin-bottom:4px}
.daycell{min-width:0}
.daybar{height:25px;background:#f3e9dd;border:1px solid #eadbce;border-radius:7px;display:flex;align-items:stretch;overflow:hidden}
.seg{min-width:6px;flex:0 0 6px}
.daycell.today .daybar{outline:2px solid #c99099;outline-offset:1px}
.dayvalue{text-align:center;font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.totalbar{position:relative;height:30px;background:#f1e5d8;border:1px solid #e4d2c2;border-radius:8px;overflow:visible}
.totalbar .base{position:absolute;inset:0;border-radius:8px}
.totalbar .fill{position:absolute;left:0;top:0;height:100%;display:flex;overflow:hidden;border-radius:7px;min-width:0}
.totalbar .overflow{position:absolute;left:100%;top:0;height:100%;display:flex;overflow:hidden;border-radius:0 7px 7px 0}
.targetline{position:absolute;right:-1px;top:-5px;height:40px;border-left:2px dashed #a9786e;z-index:4}
.targetlabel{position:absolute;right:-1px;top:-19px;transform:translateX(50%);font-size:9px;color:var(--muted);white-space:nowrap}
.totalinfo{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.totalinfo strong{color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:7px 11px;font-size:10px;color:var(--muted);margin-top:9px}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.comparebox{background:var(--card2);border:1px solid var(--border);border-radius:13px;padding:12px}
.comparebox .big{font-size:20px;font-weight:700;margin:4px 0}
.delta.up{color:#9b6a5c}.delta.down{color:#66866b}.delta.same{color:var(--muted)}
.calendar-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calday{min-height:70px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:5px;cursor:pointer}
.calday.empty{background:transparent;border-color:transparent;cursor:default}
.calday.today{outline:2px solid #c99099;outline-offset:1px}
.calnum{font-size:10px;color:var(--muted);margin-bottom:5px}
.caldots{display:flex;gap:3px;flex-wrap:wrap}
.caldot{height:5px;border-radius:3px;flex:1;min-width:8px}
.calamount{font-size:9px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden}
.tabs{display:flex;gap:7px;margin-bottom:14px}
.tabs button{flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.setting-row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:end;margin-bottom:10px}
.modal{position:fixed;inset:0;background:rgba(70,46,35,.28);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20}
.modal.open{display:flex}
.modalbox{width:min(560px,100%);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(60,40,30,.18)}
.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1}
@media(min-width:600px){.modal{align-items:center}.app{padding-top:28px}}
@media(max-width:470px){.grid3{grid-template-columns:1fr}.setting-row{grid-template-columns:1fr 125px}.days{gap:3px}.daybar{height:23px}.app{padding-left:12px;padding-right:12px}}

/* Personal lock */
#lockScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}
.lockbox{width:min(420px,100%);background:var(--card);border:1px solid var(--border);border-radius:22px;padding:26px 20px;box-shadow:0 12px 40px rgba(93,65,47,.10);text-align:center}
.lockicon{font-size:30px;margin-bottom:8px}.lockbox h1{font-size:22px;margin-bottom:7px}.lockbox p{font-size:12px;color:var(--muted);line-height:1.7}.lockbox input{text-align:center;font-size:20px;letter-spacing:.18em;max-width:240px;margin:16px auto 0}.lock-error{font-size:12px;color:#a45d65;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div id="lockScreen" aria-label="個人用ロック">
  <div class="lockbox">
    <div class="lockicon">🔒</div>
    <h1>運動記録</h1>
    <p>個人用アプリです。<br>設定したコードを入力してください。</p>
    <input id="accessCode" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="コード" aria-label="アクセスコード">
    <button id="unlockButton" class="primary">入る</button>
    <div id="lockError" class="lock-error"></div>
  </div>
</div>

<div class="app">
<header><div><h1>運動記録</h1><p class="sub">今日の運動を、あとから振り返れる記録帳</p></div></header>

<div class="nav">
<button data-page="home" class="active">記録</button>
<button data-page="review">振り返り</button>
<button data-page="settings">目標</button>
</div>

<main id="page-home">
<section class="card">
<h2>今日の記録</h2>
<p class="sub" id="todayLabel"></p>
<div class="grid3" style="margin-top:12px">
<label>トレッドミル（分）<input id="inT" type="number" min="0" step="1"></label>
<label>歩数<input id="inS" type="number" min="0" step="1"></label>
<label>Fit Boxing 2（分）<input id="inB" type="number" min="0" step="1"></label>
</div>
<button class="primary" id="saveToday">今日の記録を保存</button>
<div class="status" id="saveStatus"></div>
</section>

<section class="card">
<div class="weeknav">
<button class="ghost" id="prevHome">‹</button><div class="weektitle" id="homeWeek"></div><button class="ghost" id="nextHome">›</button>
</div>
<div id="homeMetrics" class="metrics"></div>
</section>

<section class="card">
<h2>週間トータル</h2>
<div id="homeTotals" class="metrics"></div>
<div class="legend" id="legend"></div>
</section>
</main>

<main id="page-review" style="display:none">
<section class="card">
<div class="tabs"><button id="weekTab" class="active">週間比較</button><button id="monthTab">月間</button></div>
<div id="weekReview">
<div class="weeknav"><button class="ghost" id="prevReview">‹</button><div class="weektitle" id="reviewWeek"></div><button class="ghost" id="nextReview">›</button></div>
<div id="comparison"></div>
</div>
<div id="monthReview" style="display:none">
<div class="weeknav"><button class="ghost" id="prevMonth">‹</button><div class="weektitle" id="monthTitle"></div><button class="ghost" id="nextMonth">›</button></div>
<div class="calendar-head" id="calHead"></div>
<div class="calendar-grid" id="calendar"></div>
<p class="sub" style="margin-top:10px">日付をタップすると、その日の記録を編集できます。</p>
</div>
</section>
</main>

<main id="page-settings" style="display:none">
<section class="card">
<h2>週間目標</h2>
<p class="sub" style="margin-bottom:13px">目標を100%として、達成後はバーが右へ伸びます。</p>
<div class="setting-row"><label>トレッドミル（分）<input id="goalT" type="number" min="1" step="1"></label><span class="sub">1週間の目標</span></div>
<div class="setting-row"><label>歩数（歩）<input id="goalS" type="number" min="1" step="100"></label><span class="sub">1週間の目標</span></div>
<div class="setting-row"><label>Fit Boxing 2（分）<input id="goalB" type="number" min="1" step="1"></label><span class="sub">1週間の目標</span></div>
<button class="primary" id="saveGoals">目標を保存</button>
<div class="status" id="goalStatus"></div>
</section>
<section class="card">
<h2>このアプリについて</h2>
<p class="sub">記録と目標は、この端末のブラウザ内に保存されます。Apple Healthなど外部サービスとの連携は行いません。</p>
</section>
</main>
</div>

<div class="modal" id="modal">
<div class="modalbox">
<div class="row"><h2 style="margin:0" id="modalTitle">記録を編集</h2><button class="ghost" id="closeModal">閉じる</button></div>
<div class="grid3" style="margin-top:13px">
<label>トレッドミル（分）<input id="editT" type="number" min="0" step="1"></label>
<label>歩数<input id="editS" type="number" min="0" step="1"></label>
<label>Fit Boxing 2（分）<input id="editB" type="number" min="0" step="1"></label>
</div>
<div class="modal-actions"><button class="ghost" id="deleteRecord">この日の記録を削除</button><button class="primary" style="margin:0" id="saveEdit">保存</button></div>
</div>
</div>

<script>
const KEY="exercise-records-v2", GOALKEY="exercise-goals-v2";
const days=["月","火","水","木","金","土","日"];
const css=["--mon","--tue","--wed","--thu","--fri","--sat","--sun"];
let records=JSON.parse(localStorage.getItem(KEY)||"{}");
let goals=JSON.parse(localStorage.getItem(GOALKEY)||'{"treadmill":180,"steps":50000,"boxing":90}');
let homeOffset=0, reviewOffset=0, monthOffset=0, editDate=null;

function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function persistGoals(){localStorage.setItem(GOALKEY,JSON.stringify(goals))}
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function parseKey(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function monday(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekDates(offset=0){let m=monday(new Date());m.setDate(m.getDate()+offset*7);return Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return d})}
function get(d){return records[key(d)]||{treadmill:0,steps:0,boxing:0}}
function fmt(n){return Number(n||0).toLocaleString("ja-JP")}
function dateJP(d){return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function weekTitle(ds){return `${ds[0].getFullYear()}/${ds[0].getMonth()+1}/${ds[0].getDate()} – ${ds[6].getMonth()+1}/${ds[6].getDate()}`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const metrics=[
 {id:"treadmill",label:"トレッドミル",unit:"分",step:5,goal:()=>goals.treadmill,format:n=>`${fmt(n)}分`},
 {id:"steps",label:"歩数",unit:"歩",step:1000,goal:()=>goals.steps,format:n=>`${fmt(n)}歩`},
 {id:"boxing",label:"Fit Boxing 2",unit:"分",step:5,goal:()=>goals.boxing,format:n=>`${fmt(n)}分`}
];

function segments(value,dayIndex,step){
 let n=Math.ceil((Number(value)||0)/step), out="";
 for(let i=0;i<n;i++) out+=`<span class="seg" style="background:var(${css[dayIndex]})"></span>`;
 return out;
}
function renderWeek(containerId,ds){
 const el=document.getElementById(containerId);
 el.innerHTML=metrics.map(m=>{
  const total=ds.reduce((a,d)=>a+Number(get(d)[m.id]||0),0);
  return `<div>
   <div class="metric-head"><span>${m.label}</span><strong>${m.format(total)}</strong></div>
   <div class="days">${ds.map((d,i)=>{
    const v=Number(get(d)[m.id]||0);
    return `<div class="daycell ${key(d)===key(new Date())?"today":""}">
      <div class="dayname">${days[i]}</div><div class="daybar">${segments(v,i,m.step)}</div>
      <div class="dayvalue">${v?m.format(v):"—"}</div>
    </div>`
   }).join("")}</div>
  </div>`
 }).join("");
}
function renderTotal(containerId,ds){
 const el=document.getElementById(containerId);
 el.innerHTML=metrics.map(m=>{
  const total=ds.reduce((a,d)=>a+Number(get(d)[m.id]||0),0), goal=Math.max(1,Number(m.goal())||1);
  const ratio=total/goal, pct=Math.min(100,ratio*100);
  let normal="", over="";
  let remaining=Math.ceil(Math.min(total,goal)/m.step), skip=0;
  ds.forEach((d,i)=>{
    let n=Math.ceil(Number(get(d)[m.id]||0)/m.step);
    for(let j=0;j<n;j++){
      if(skip<remaining){normal+=`<span class="seg" style="background:var(${css[i]})"></span>`;skip++}
      else over+=`<span class="seg" style="background:var(${css[i]})"></span>`;
    }
  });
  return `<div>
   <div class="totalinfo"><span>${m.label}</span><strong>${m.format(total)} / ${m.format(goal)}</strong></div>
   <div class="totalbar">
    <div class="base"></div><div class="fill" style="width:${pct}%">${normal}</div>
    <div class="overflow" style="width:${Math.max(0,(ratio-1)*100)}%">${over}</div>
    <div class="targetline"><span class="targetlabel">100%</span></div>
   </div>
  </div>`
 }).join("");
}
function renderLegend(){
 document.getElementById("legend").innerHTML=days.map((d,i)=>`<span><i class="dot" style="background:var(${css[i]})"></i>${d}</span>`).join("");
}
function loadToday(){
 const r=get(new Date());
 document.getElementById("inT").value=r.treadmill||"";document.getElementById("inS").value=r.steps||"";document.getElementById("inB").value=r.boxing||"";
 document.getElementById("todayLabel").textContent=dateJP(new Date());
}
function renderHome(){
 const ds=weekDates(homeOffset);
 homeWeek.textContent=weekTitle(ds);
 renderWeek("homeMetrics",ds);renderTotal("homeTotals",ds);renderLegend();
}
function delta(a,b){
 const d=a-b;if(d===0)return `<span class="delta same">±0</span>`;
 return d>0?`<span class="delta up">+${fmt(d)}</span>`:`<span class="delta down">${fmt(d)}</span>`;
}
function renderComparison(){
 const cur=weekDates(reviewOffset), prev=weekDates(reviewOffset-1);
 reviewWeek.textContent=weekTitle(cur);
 comparison.innerHTML=metrics.map(m=>{
  const a=cur.reduce((s,d)=>s+Number(get(d)[m.id]||0),0);
  const b=prev.reduce((s,d)=>s+Number(get(d)[m.id]||0),0);
  const pct=b?Math.round((a-b)/b*100):a?null:0;
  return `<div class="card" style="margin-bottom:10px;background:var(--card2)">
    <div class="metric-head"><span>${m.label}</span>${pct===null?"":`<strong>${pct>0?"+":""}${pct}%</strong>`}</div>
    <div class="compare">
      <div class="comparebox"><div class="sub">今週</div><div class="big">${m.format(a)}</div><div>${delta(a,b)}</div></div>
      <div class="comparebox"><div class="sub">前週</div><div class="big">${m.format(b)}</div><div class="sub">${m.format(m.goal())} が目標</div></div>
    </div>
  </div>`
 }).join("");
}
function renderMonth(){
 const base=new Date(new Date().getFullYear(),new Date().getMonth()+monthOffset,1);
 monthTitle.textContent=`${base.getFullYear()}年${base.getMonth()+1}月`;
 calHead.innerHTML=days.map(d=>`<div class="dayname">${d}</div>`).join("");
 const first=(base.getDay()+6)%7, last=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
 let html=Array(first).fill('<div class="calday empty"></div>').join("");
 for(let n=1;n<=last;n++){
  const d=new Date(base.getFullYear(),base.getMonth(),n),r=get(d);
  const vals=metrics.map(m=>Number(r[m.id]||0)), active=vals.some(Boolean);
  html+=`<div class="calday ${key(d)===key(new Date())?"today":""}" onclick="openEdit('${key(d)}')">
   <div class="calnum">${n}</div>
   <div class="caldots">${metrics.map((m,i)=>`<span class="caldot" style="background:var(${css[(d.getDay()+6)%7]});opacity:${vals[i]?1:.18}"></span>`).join("")}</div>
   <div class="calamount">${active?`${fmt(vals[0])}分 / ${fmt(vals[1])}歩`:""}</div>
  </div>`;
 }
 calendar.innerHTML=html;
}
function openEdit(k){
 editDate=k;const d=parseKey(k),r=get(d);document.getElementById("modalTitle").textContent=`${d.getMonth()+1}月${d.getDate()}日の記録`;
 document.getElementById("editT").value=r.treadmill||"";document.getElementById("editS").value=r.steps||"";document.getElementById("editB").value=r.boxing||"";document.getElementById("modal").classList.add("open");
}
window.openEdit=openEdit;
function closeEdit(){document.getElementById("modal").classList.remove("open");editDate=null}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 ["home","review","settings"].forEach(p=>document.getElementById("page-"+p).style.display=p===b.dataset.page?"block":"none");
 if(b.dataset.page==="review"){renderComparison();renderMonth()}
});
document.getElementById("saveToday").onclick=()=>{
 records[key(new Date())]={
  treadmill:Math.max(0,Number(document.getElementById("inT").value)||0),
  steps:Math.max(0,Number(document.getElementById("inS").value)||0),
  boxing:Math.max(0,Number(document.getElementById("inB").value)||0)
 };
 save();
 document.getElementById("saveStatus").textContent="保存しました。";
 renderHome();
};
document.getElementById("prevHome").onclick=()=>{homeOffset--;renderHome()}
document.getElementById("nextHome").onclick=()=>{homeOffset++;renderHome()}
document.getElementById("prevReview").onclick=()=>{reviewOffset--;renderComparison()}
document.getElementById("nextReview").onclick=()=>{reviewOffset++;renderComparison()}
weekTab.onclick=()=>{weekTab.classList.add("active");monthTab.classList.remove("active");weekReview.style.display="block";monthReview.style.display="none"}
monthTab.onclick=()=>{monthTab.classList.add("active");weekTab.classList.remove("active");weekReview.style.display="none";monthReview.style.display="block";renderMonth()}
prevMonth.onclick=()=>{monthOffset--;renderMonth()}
nextMonth.onclick=()=>{monthOffset++;renderMonth()}
document.getElementById("saveGoals").onclick=()=>{
 goals={
  treadmill:Math.max(1,Number(document.getElementById("goalT").value)||1),
  steps:Math.max(1,Number(document.getElementById("goalS").value)||1),
  boxing:Math.max(1,Number(document.getElementById("goalB").value)||1)
 };
 persistGoals();
 document.getElementById("goalStatus").textContent="目標を保存しました。";
 renderHome();
};
closeModal.onclick=closeEdit;
modal.onclick=e=>{if(e.target===modal)closeEdit()}
document.getElementById("saveEdit").onclick=()=>{
 const r={
  treadmill:Math.max(0,Number(document.getElementById("editT").value)||0),
  steps:Math.max(0,Number(document.getElementById("editS").value)||0),
  boxing:Math.max(0,Number(document.getElementById("editB").value)||0)
 };
 if(Object.values(r).every(v=>v===0)) delete records[editDate]; else records[editDate]=r;
 save();closeEdit();renderHome();renderComparison();renderMonth();
};
document.getElementById("deleteRecord").onclick=()=>{
 if(editDate){delete records[editDate];save();closeEdit();renderHome();renderComparison();renderMonth()}
}

document.getElementById("goalT").value=goals.treadmill;document.getElementById("goalS").value=goals.steps;document.getElementById("goalB").value=goals.boxing;
loadToday();renderHome();renderComparison();renderMonth();

// Personal access lock. This is a convenience lock, not server-side authentication.
const PERSONAL_CODE = "739184"; // 仮コード：公開前に好きなコードへ変更してください
const lockScreen = document.getElementById("lockScreen");
const accessCode = document.getElementById("accessCode");
const unlockButton = document.getElementById("unlockButton");
const lockError = document.getElementById("lockError");
function unlock(){
  if(accessCode.value === PERSONAL_CODE){
    sessionStorage.setItem("exerciseAppUnlocked","1");
    lockScreen.style.display="none";
    lockError.textContent="";
  }else{
    lockError.textContent="コードが違います。もう一度入力してください。";
    accessCode.select();
  }
}
unlockButton.onclick=unlock;
accessCode.addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
if(sessionStorage.getItem("exerciseAppUnlocked")==="1") lockScreen.style.display="none";
</script>
